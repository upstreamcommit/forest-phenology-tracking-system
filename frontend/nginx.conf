server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # The API, on the compose network. Same paths as the Vite dev proxy (vite.config.ts).
  # $http_host keeps the client's port, so the API's redirects (/catalog/ to /catalog) stay here.
  location ~ ^/(catalog|phenology|health|docs|openapi\.json)(/|$) {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The app's own responses, error pages included, get the security headers in
  # security-headers.conf (shared with `vite preview`). The API's pages (/docs loads Swagger UI
  # from a CDN) are proxied above and keep the API's headers. A location with its own add_header
  # inherits none, so each one below includes the file.

  # nginx's mime.types has no .mjs entry, and browsers refuse module scripts (MapLibre's worker is
  # one) served as application/octet-stream. Regex locations win over /assets/ below.
  location ~ ^/assets/.+\.mjs$ {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Vite fingerprints everything under /assets, so it can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Everything else is the single-page app: unknown paths get index.html, never cached, so a new
  # deploy is picked up on the next load.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
