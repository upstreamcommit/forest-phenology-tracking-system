# Security headers for the app's own responses (not the proxied API). nginx.conf includes this
# file, and vite.config.ts reads it for `vite preview`, so the end-to-end and accessibility tests
# run under the same policy. vite.config.ts accepts only lines of the form
# `add_header Name "value" always;` (and comments). compose_smoke_test.sh pins the full policy, so
# change it there too.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
