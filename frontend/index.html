<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore synthetic forest phenology metrics: start, end and length of the growing season on a map."
    />
    <title>Forest Phenology Explorer</title>
    <script>
      // Apply the saved or system theme before first paint, so the page never flashes the wrong one.
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('fpts-theme') || 'system'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
