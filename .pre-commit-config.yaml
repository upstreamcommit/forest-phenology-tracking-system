repos:
  # Use the ruff pinned in poetry.lock so pre-commit, CI and local runs agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]

      - id: integration-tests-docker
        name: Run docker-compose.test.yml + pytest
        entry: ./precommit_tests.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|tests/).*\.(py)$
