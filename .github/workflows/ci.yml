name: ci

# Pushes to main, every pull request (so PR commits run once), and manual runs from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same PR cancels that PR's older run. Every other run (pushes to main,
# manual runs) gets its own group per commit, so none is cancelled or replaced while queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash adds -o pipefail, so a failing command piped into tee still fails the step.
    shell: bash

jobs:
  # Job names are the check names; keep them stable (no versions) for required status checks.
  python:
    runs-on: ubuntu-latest
    env:
      # Same test database as ./precommit_tests.sh (docker-compose.test.yml).
      FPTS_TEST_DATABASE_DSN: postgresql://postgres:postgres@localhost:55432/fpts_test
      # Fail instead of skipping integration tests if the DSN is missing.
      FPTS_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same Poetry as the Dockerfile; bump both together.
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.5.1

      - name: Check poetry.lock matches pyproject.toml
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      # Uses the ruff pinned in poetry.lock, the same one the pre-commit hooks run.
      - name: Lint (ruff)
        run: |
          poetry run ruff check src tests
          poetry run ruff format --check src tests

      # Builds Dockerfile.postgis-test, which applies the schema through initdb.
      - name: Start the test database
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      # Coverage scope and the fail_under floor live in pyproject.toml.
      - name: Unit and integration tests (pytest + coverage)
        run: poetry run pytest -q -m "integration or not integration" --cov --cov-report=term-missing

      - name: Show test database logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Stop the test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  stack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      # Seeds the database and data volume, then starts the API.
      - name: Start the stack
        run: docker compose up -d

      # The script's last line is "all checks passed" only when the API log was checked too.
      - name: Smoke test
        run: |
          ./compose_smoke_test.sh | tee "$RUNNER_TEMP/smoke.log"
          last_line="$(tail -n 1 "$RUNNER_TEMP/smoke.log")"
          if [ "$last_line" != "all checks passed" ]; then
            echo "Expected 'all checks passed', got: $last_line"
            exit 1
          fi

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds again with VITE_BASEMAP=none and mocks the API, so it needs no backend or network.
      - name: End-to-end and accessibility tests
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
