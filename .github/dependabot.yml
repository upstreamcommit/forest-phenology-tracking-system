# Monthly, grouped dependency updates so the maintainer (human or AI) gets a few
# reviewable PRs instead of one per package. Groups take minor and patch updates only, so each
# major update arrives as its own PR.
version: 2
updates:
  - package-ecosystem: "pip" # covers pyproject.toml / poetry.lock
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 (TypeScript minors can break it too).
      # Lift this once typescript-eslint supports the newer TypeScript.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # CI and the Dockerfile both pin the 3.12 minor (pyproject allows ^3.12); move them together,
      # once every locked binary package publishes wheels for the new minor.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # A Postgres major needs a data volume migration (or `docker compose down -v`), so it is a
      # planned change, not a routine bump. CI builds these same Dockerfiles, so it follows along.
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]

  # Images the compose files pull directly (today only redis:7-alpine, a major-only tag, so this
  # proposes redis majors); the "docker" entry above only reads Dockerfiles.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
