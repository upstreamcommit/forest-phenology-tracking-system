# Monthly, grouped dependency updates so the maintainer (human or AI) gets a few
# reviewable PRs instead of one per package.
version: 2
updates:
  - package-ecosystem: "pip" # covers pyproject.toml / poetry.lock
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
